name: stylestore_mobile
description: "StyleStore Mobile Authentication and Dashboard App built with Flutter."
publish_to: 'none'
version: 1.0.13+14

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.12.0
  url_launcher: ^6.3.0
  sqflite: 2.4.2
  uuid: 4.5.1
  connectivity_plus: 6.1.5
  path: 1.9.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  geolocator: ^14.0.2
  cached_network_image: ^4.0.3
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: 2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
